<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoices · Payables Hub</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=29">
</head>
<body>
  <main>
    <div class="page-head">
      <div>
        <h1 id="page-title">Invoices</h1>
        <p id="scope-text">Every invoice pack matched in the hub, most recent first.</p>
      </div>
      <div class="toolbar">
        <a class="btn small" href="/api/export.csv" id="export-link" hidden>Export CSV</a>
        <button type="button" class="btn small" id="clear-runs" hidden>Clear runs</button>
        <a class="btn primary" href="/submit.html" id="new-btn" hidden>New submission</a>
      </div>
    </div>

    <div class="alert warn confirm-row" id="clear-confirm" hidden style="margin-bottom:16px">
      <span><strong style="display:inline">Clear runs?</strong> This deletes every case except the 3 newest, with their reviews. It cannot be undone.</span>
      <span class="spacer"></span>
      <button type="button" class="btn small danger-solid" id="clear-yes">Yes, clear them</button>
      <button type="button" class="btn small" id="clear-no">Cancel</button>
    </div>
    <div class="alert info" id="clear-note" hidden style="margin-bottom:16px"></div>

    <div class="stats" id="stats"></div>

    <div class="card flush">
      <div class="toolbar" style="padding:14px 16px;border-bottom:1px solid var(--border)">
        <input type="search" id="search" placeholder="Search vendor, invoice or reference" aria-label="Search invoices">
        <span class="muted small" id="count-text"></span>
      </div>
      <div class="table-wrap" id="table-wrap"><div class="empty">Loading invoices…</div></div>
    </div>
    <div class="alert bad" id="error" hidden style="margin-top:16px"></div>
  </main>
  <script src="/common.js?v=29"></script>
  <script src="/cases.js?v=29"></script>
</body>
</html>
