<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · AP Invoice Validation</title>
  <link rel="icon" href="/brand-mark.png">
  <link rel="stylesheet" href="/styles.css?v=11">
</head>
<body class="signin-page">
  <main class="signin">
    <section class="card signin-card">
      <img class="signin-logo" src="/logo.png" alt="Applied AI">
      <span class="pill info">AP Invoice Validation</span>
      <h1>Sign in</h1>
      <p class="lead" id="lead">Validate supplier invoices against the purchase order and goods receipt, and decide on the exceptions.</p>

      <div id="demo" hidden>
        <p class="hint" style="margin:0 0 10px">Demo mode: pick an account to sign in. Everything here is test data.</p>
        <div class="demo-list" id="demo-buttons"></div>
        <div class="alert bad" id="demo-error" role="alert" hidden style="margin-top:12px"></div>
        <details class="signin-switch" id="email-switch"><summary>Sign in with email instead</summary><div style="height:14px"></div><div id="form-slot"></div></details>
      </div>

      <form id="login-form" class="stack" novalidate>
        <label class="field"><span>Email</span><input type="email" id="email" autocomplete="username" required></label>
        <label class="field"><span>Password</span><input type="password" id="password" autocomplete="current-password" required></label>
        <div class="alert bad" id="login-error" role="alert" hidden></div>
        <button class="btn primary block" type="submit" id="login-btn">Sign in</button>
      </form>
    </section>
  </main>
  <footer class="footer"><span>Applied AI · AP Invoice Validation</span><span>Powered by Opus</span></footer>
  <script src="/common.js?v=11"></script>
  <script src="/login.js?v=11"></script>
</body>
</html>
