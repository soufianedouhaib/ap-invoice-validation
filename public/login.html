<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Payables Hub</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=29">
</head>
<body class="signin-page">
  <main class="signin">
    <section class="card signin-card">
      <div class="signin-brand" id="signin-brand"></div>
      <h1>Sign in</h1>
      <p class="lead" id="lead">Match supplier invoices to their purchase order and goods receipt, and approve the exceptions.</p>

      <div id="demo" hidden>
        <p class="hint" style="margin:0 0 10px">Choose your account.</p>
        <div class="demo-list" id="demo-buttons"></div>
        <div class="alert bad" id="demo-error" role="alert" hidden style="margin-top:12px"></div>
      </div>

      <form id="login-form" class="stack" novalidate>
        <label class="field"><span>Work email</span><input type="email" id="email" autocomplete="username" required></label>
        <label class="field"><span>Password</span><input type="password" id="password" autocomplete="current-password" required></label>
        <div class="alert bad" id="login-error" role="alert" hidden></div>
        <button class="btn primary block" type="submit" id="login-btn">Sign in</button>
      </form>
    </section>
  </main>
  <footer class="footer"><span><b>Payables Hub</b> · Finance Shared Services · Harbourline Group</span></footer>
  <script src="/common.js?v=29"></script>
  <script src="/login.js?v=29"></script>
</body>
</html>
