<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overview · Payables Hub</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=29">
</head>
<body>
  <main>
    <div class="page-head">
      <div>
        <p class="eyebrow" id="today"></p>
        <h1 id="greeting">Overview</h1>
        <p id="lede">What needs your attention, and how this month is going.</p>
      </div>
      <div class="toolbar"><a class="btn primary" id="primary-action" href="/submit.html" hidden></a></div>
    </div>

    <div class="kpis" id="kpis" aria-live="polite"></div>

    <div class="overview-grid">
      <section class="card flush" aria-labelledby="att-title">
        <div class="card-head pad"><div><h2 id="att-title">Needs attention</h2><p id="att-sub">Loading…</p></div></div>
        <ul class="attention" id="attention"></ul>
      </section>

      <section class="card flush" aria-labelledby="recent-title">
        <div class="card-head pad"><div><h2 id="recent-title">Recent submissions</h2><p id="recent-sub"></p></div><a class="btn small" href="/" id="all-link">All invoices</a></div>
        <div class="table-wrap" id="recent"></div>
      </section>
    </div>
    <div class="alert bad" id="error" hidden style="margin-top:16px"></div>
  </main>
  <script src="/common.js?v=29"></script>
  <script src="/overview.js?v=29"></script>
</body>
</html>
