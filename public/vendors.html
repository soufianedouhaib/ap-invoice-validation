<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vendors · Payables Hub</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=28">
</head>
<body>
  <main data-view="vendors">
    <div class="page-head">
      <div>
        <p class="eyebrow">Suppliers &amp; payments</p>
        <h1>Vendors <span class="pill plain ro-pill">Read only</span></h1>
        <p id="lede"></p>

        <span class="muted small" id="count-text"></span>
      </div>
      <div class="table-wrap" id="table-wrap"><div class="empty">Loading…</div></div>
    </div>
    <div class="alert bad" id="error" hidden style="margin-top:16px"></div>
